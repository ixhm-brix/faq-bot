{% extends "base.html" %}
{% block title %}Sign in — FAQ Bot Portal{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white rounded-lg shadow-sm border border-gray-200 p-6 mt-12">
  <h1 class="text-xl font-semibold mb-1">Sign in</h1>
  <p class="text-sm text-gray-500 mb-5">Manage the FAQ documents your bot answers from.</p>
  {% if error %}
    <div class="mb-4 p-3 rounded bg-red-50 border border-red-200 text-red-800 text-sm">{{ error }}</div>
  {% endif %}
  <form method="post" action="/login" class="space-y-3">
    <div>
      <label class="block text-sm font-medium text-gray-700">Username</label>
      <input name="username" autocomplete="username" required
             class="mt-1 w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">Password</label>
      <input name="password" type="password" autocomplete="current-password" required
             class="mt-1 w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
    </div>
    <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium rounded py-2 transition">Sign in</button>
  </form>
</div>
{% endblock %}
